# value_prop.yaml — the relevance lens
#
# Compass III: relevance is a three-way join of SIGNAL x WHAT WE SELL x THIS PERSON'S ROLE.
# Nothing in the ranker is meaningful without this file. It is a required input, not a template.
#
# Decided 2026-08-23. Change it deliberately — every ranking decision downstream depends on it.

product: "We help operations teams automate manual, reconciliation-heavy processes"

# Who this lands with. Guidance only — never a gate. Best-effort tie to the person's
# actual role when known; if unknown or unrelated, hook company-level and say so.
buyer_functions: "anyone owning or influencing operations/finance processes (CEO, CFO, COO, Controller, VP/Director of Ops or Finance, Chief Strategy, RevOps, or adjacent)"

# The pains signals get scored against.
#
# These are PAINS, not triggers. A trigger is something observable (they posted a job);
# a pain is what hurts. Keeping them distinct is what gives the ranker something to join on —
# if pains were triggers, signal and pain collapse into one thing and ranking loses its meaning.
#
# Narrow on purpose. Vague pains match every signal, which looks like coverage and is
# actually the loss of discrimination.
pains:
  - id: close_drag
    statement: "Month-end close drags because matching is manual across systems"
    observable_via:
      - job postings for accountants/analysts mentioning close, matching, or month-end
      - hiring in finance ops without corresponding revenue growth

  - id: silent_breaks
    statement: "Payment, ledger, and bank reconciliation breaks silently and surfaces late"
    observable_via:
      - job postings mentioning PSP, ledger, settlement, or payment ops
      - new payment methods, providers, or geographies in news or product announcements

  - id: linear_headcount
    statement: "Ops headcount scales linearly with transaction volume"
    observable_via:
      - repeated or bulk hiring of ops/fulfilment/analyst roles
      - volume, GMV, or growth milestones in news

  - id: spreadsheet_exceptions
    statement: "Exceptions are handled in spreadsheets with no audit trail"
    observable_via:
      - job descriptions naming Excel/Google Sheets as a core tool for a finance/ops role
      - ERP or finance-system migration signals
      
  - id: structural_complexity
    statement: "Rapid expansion, new leadership, or structural changes inherently create intercompany reconciliation sprawl"
    observable_via:
      - recent appointments of new finance leadership (CFO, VP Finance, Controller) within the last 6 months
      - securing significant debt facilities, leases, or funding for expansion
      - M&A activity or corporate restructuring
      - reports of turning profitable or significant quarterly growth

# ICP rubric — INFORMATIONAL ONLY. Never rejects a prospect. Deviations are computed
# and surfaced on the decision card ("it is what it is" — stated, not gated).
# LinkedIn Company Details supplies headcount; without it, icp_fit degrades to `unknown`, never a guess.
icp:
  headcount:
    preferred_min: 50
    preferred_max: 2000

# Compass X: relevance is not permission.
#
# These score HIGHEST on naive relevance and are unusable. A layoff is the most
# "relevant" signal a company ever emits and referencing it is disqualifying.
# Hard veto in the ranker, applied before scoring, independent of score.
# Data, not a buried constant, so it can be argued with.
never_reference:
  - id: layoffs
    terms: [layoff, layoffs, laid off, lay off, redundanc, restructur, downsiz, job cuts, workforce reduction, headcount reduction, rif]
  - id: bereavement
    terms: [passed away, obituary, bereavement, in memoriam, condolence, death of, funeral]
  - id: illness
    terms: [medical leave, illness, diagnosed with, hospitalised, hospitalized, sick leave, cancer]
  - id: litigation
    terms: [lawsuit, litigation, sued, court filing, legal dispute, class action, subpoena]
  - id: discrimination_claim
    terms: [discrimination, harassment, hostile work environment, retaliation claim, eeoc]
  - id: regulatory_action
    terms: [enforcement action, investigation by, consent order, cease and desist, fined by, regulatory probe, sanctions against]
  - id: forced_departure
    terms: [ousted, fired, stepped down amid, terminated for, forced out, removed as ceo]

# DECIDED: omitted by default in strict mode. Permissive mode allows this benchmark.
proof_point: "We help companies in your sector cut month-end close times by up to 30-40% without ripping out existing ERPs."

# DECIDED 2026-08-23 by the human: sign as the company.
# The drafter must sign exactly as configured and must not invent a human signer.
sender_name: "Zamp"

# Ranker Tie-Breaking Weights
# These control how the ranker breaks ties when multiple signals have the same pain score.
proximity_weights:
  authored: 4               # the prospect's own words, name verified in the content
  attributed: 3             # the prospect named by someone else
  colleague_authored: 2.5   # a named exec at the company on the record -- real
                            # evidence about how the org runs, but NOT the prospect's
                            # voice. Never draft this in the second person.
  company_action: 2
  database: 1
