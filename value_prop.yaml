# value_prop.yaml — the relevance lens
#
# Compass III: relevance is a three-way join of SIGNAL x WHAT WE SELL x THIS PERSON'S ROLE.
# Nothing in the ranker is meaningful without this file. It is a required input, not a template.
#
# Decided 2026-08-23. Change it deliberately — every ranking decision downstream depends on it.

product: "We help operations teams automate manual, reconciliation-heavy processes"

# Who this lands with. Guidance only — never a gate. Best-effort tie to the person's
# actual role when known; if unknown or unrelated, hook company-level and say so.
buyer_functions: "anyone owning or influencing operations/finance processes (CEO, CFO, COO, Controller, VP/Director of Ops or Finance, Chief Strategy, RevOps, or adjacent)"

# The pains signals get scored against.
#
# These are PAINS, not triggers. A trigger is something observable (they posted a job);
# a pain is what hurts. Keeping them distinct is what gives the ranker something to join on —
# if pains were triggers, signal and pain collapse into one thing and ranking loses its meaning.
#
# Narrow on purpose. Vague pains match every signal, which looks like coverage and is
# actually the loss of discrimination.
#
# CHANGED 2026-08-25: job postings were cut from the product, and four of these
# five pains named job ads as an observable -- three of them as their ONLY one.
# Left alone they would have been unmatchable, and every prospect would collapse
# to `general_news`. Rewritten against what the surviving sources actually return:
# news (GoogleNews, ExaNews), authored/social (ExaLinkedIn, ExaYouTube, Apify),
# company site (Jina), and open web (Tavily).
# CHANGED 2026-09-02: every pain gains a person-tier observable, because measurement
# said the set could only be satisfied by press releases.
#
# Across 238 scored cards in var/zara_runs.db, 77% matched no pain at all and landed
# on `general_news` at the 0.30 floor. Everything scoring >=0.70 was a corporate
# event -- "M&A acquisition disclosed", "Announces $200M funding", "Opened new
# fulfillment center". Everything a person SAID failed, in the scorer's own words:
# "Founder video, no observable pain", "Founders discuss PSP, no specific
# observable", "Duplicate tech-stack interview, no observable pain".
#
# The cause was the shape of the lines below. Three pains asked for "an executive
# describing [their own manual process]", and nobody publicly posts that their
# month-end close is a mess. So the set was inverted against the proximity ladder:
# `authored` (weight 4) matched a real pain 14% of the time while `company_action`
# (weight 2) matched 33%, and 61% of winners came out company-tier.
#
# What executives DO publish is argument about their category. Chermaine Hu's post --
# "legacy payments weren't built for the world fintech operates in now" -- is a CFO
# making a substantive public claim about payment infrastructure, and it scored
# `general_news` with the reason "CFO appointment news, no observable pain".
#
# Accepting a category argument as evidence is not a loosening. drafter.py already
# REQUIRES the email's claim to be about the category and forbids asserting the
# prospect's internals, so this aligns what the scorer will credit with what the
# writer is allowed to say. The press-release observables are untouched.
pains:
  - id: close_drag
    statement: "Month-end close drags because matching is manual across systems"
    observable_via:
      # "new finance leadership appointed" was removed here on 2026-09-02: it was
      # duplicated verbatim on structural_complexity, which is why an appointment
      # story could satisfy two pains at once, and why the only two `authored`
      # cards that ever matched a pain matched THIS one on "New CFO appointment
      # mentioned" -- the signal the own-appointment guardrail now blocks.
      - public mention of an ERP, close, or financial-reporting system migration or upgrade
      - an executive describing manual reporting, month-end, or data consolidation work
      - the prospect publicly arguing about close cadence, reporting timelines, or the limits of finance systems — whether or not they claim it of their own company

  - id: silent_breaks
    statement: "Payment, ledger, and bank reconciliation breaks silently and surfaces late"
    observable_via:
      - new payment methods, PSPs, acquirers, or geographies in news or product announcements
      - marketplace, partner, or multi-entity expansion that adds settlement paths
      - public incident, status-page, or outage history touching payments, billing, or settlement
      - the prospect publicly arguing about payment rails, settlement, or reconciliation infrastructure — whether or not they claim it of their own company

  - id: linear_headcount
    statement: "Ops headcount scales linearly with transaction volume"
    observable_via:
      - volume, GMV, order, or transaction growth milestones in news
      - rapid expansion into new markets, warehouses, or legal entities
      - an executive describing scaling operations, throughput, or process standardisation
      - the prospect publicly arguing about operational scaling, headcount, or throughput limits — whether or not they claim it of their own company

  - id: spreadsheet_exceptions
    statement: "Exceptions are handled in spreadsheets with no audit trail"
    # Zero matches in 238 scored cards. Its first line duplicated close_drag's
    # ERP-migration observable, so it had nothing of its own to win on, and its
    # second asked an executive to describe their own spreadsheet habit.
    observable_via:
      - publicly announced audit, compliance, or internal-controls initiatives
      - the prospect publicly arguing about manual workarounds, exception handling, audit trails, or spreadsheet-based process — whether or not they claim it of their own company

  - id: structural_complexity
    statement: "Rapid expansion, new leadership, or structural changes inherently create intercompany reconciliation sprawl"
    observable_via:
      - recent appointments of new finance leadership (CFO, VP Finance, Controller) within the last 6 months
      - securing significant debt facilities, leases, or funding for expansion
      - M&A activity or corporate restructuring
      - reports of turning profitable or significant quarterly growth
      - the prospect publicly arguing about the operational cost of expansion, entity structure, or post-acquisition integration — whether or not they claim it of their own company

# ICP rubric — INFORMATIONAL ONLY. Never rejects a prospect. Deviations are computed
# and surfaced on the decision card ("it is what it is" — stated, not gated).
# LinkedIn Company Details supplies headcount; without it, icp_fit degrades to `unknown`, never a guess.
icp:
  headcount:
    preferred_min: 50
    preferred_max: 2000

# Compass X: relevance is not permission.
#
# These score HIGHEST on naive relevance and are unusable. A layoff is the most
# "relevant" signal a company ever emits and referencing it is disqualifying.
# Hard veto in the ranker, applied before scoring, independent of score.
# Data, not a buried constant, so it can be argued with.
never_reference:
  - id: layoffs
    terms: [layoff, layoffs, laid off, lay off, redundanc, restructur, downsiz, job cuts, workforce reduction, headcount reduction, rif]
  - id: bereavement
    terms: [passed away, obituary, bereavement, in memoriam, condolence, death of, funeral]
  - id: illness
    terms: [medical leave, illness, diagnosed with, hospitalised, hospitalized, sick leave, cancer]
  - id: litigation
    terms: [lawsuit, litigation, sued, court filing, legal dispute, class action, subpoena]
  - id: discrimination_claim
    terms: [discrimination, harassment, hostile work environment, retaliation claim, eeoc]
  - id: regulatory_action
    terms: [enforcement action, investigation by, consent order, cease and desist, fined by, regulatory probe, sanctions against]
  - id: forced_departure
    terms: [ousted, fired, stepped down amid, terminated for, forced out, removed as ceo]
  # Found on real data, not imagined: the ShipMonk snapshot carries three cards
  # about a breach exposing 13,689 of their customer Trezor's records, 11 days old
  # and therefore near the top on recency. Leading outreach with a prospect's
  # security incident is indefensible, and nothing above mentioned breaches.
  # Terms are prefix-matched, so "breach" covers breached/breaches. Kept narrow
  # where a bare word would over-fire: "security incident" not "incident",
  # "exposed customer" not "exposed".
  - id: data_breach
    terms: [data breach, breach impacts, breach puts, breach exposes, security incident, ransomware, hacked, cyberattack, cyber attack, phishing risk, exposed customer, exposed personal, leaked records, credential stuffing]

# DECIDED: omitted by default in strict mode. Permissive mode allows this benchmark.
proof_point: ""

# DECIDED 2026-08-23 by the human: sign as the company.
# The drafter must sign exactly as configured and must not invent a human signer.
sender_name: "Zamp"
# Who the email says it is. Not a fabricated human -- the company speaking in the
# first person, which is what the hand-written drafts do: "I'm Zamp from Zamp
# Technologies." Empty is still honest and degrades to "I'm reaching out from
# <company>"; it just is not the voice those drafts set.
sender_person: "Zamp"
# The entity the email introduces itself as, in "I'm <person> from <company>".
# It was a literal in drafter.py until 2026-08-29, which meant every email
# introduced itself as Zamp Technologies whatever the sidebar said -- and, worse,
# the verifier blocked any OTHER sender's drafts: build_evidence_list grounds
# against the string values in this file, so a name that lived in code and not
# here read as an invented proper noun. Empty is allowed and degrades the
# introduction to sender_name; it never breaks the draft.
sender_company: "Zamp Technologies"
# Describes the ask, it is not the sentence. Written as a sentence, it WAS the
# sentence: four consecutive drafts closed "Worth a 15-minute call next week?"
# verbatim, which is the clearest mass-mail tell a batch of emails can carry.
cta: "a short call next week to see whether this is worth their time"

# Ranker Tie-Breaking Weights
# These control how the ranker breaks ties when multiple signals have the same pain score.
proximity_weights:
  authored: 4               # the prospect's own words, name verified in the content
  attributed: 3             # the prospect named by someone else
  colleague_authored: 2.5   # a named exec at the company on the record -- real
                            # evidence about how the org runs, but NOT the prospect's
                            # voice. Never draft this in the second person.
  company_action: 2
  database: 1

# How many cards reach the pain scorer, after sorting by proximity and recency.
# The ranker is roughly half a run's token spend and both prompt and completion
# scale with this number, so it is the main cost dial. Raising it costs tokens
# against Groq's 8K/min bucket; lowering it risks dropping a hook. Measured safe
# at 10: positions 5+ are uniformly company_action across all four snapshots.
# Retrieval vocabulary — what we ask the web about, as opposed to what we score
# against once it comes back.
#
# This is here rather than in a fetcher because it is policy: it decides what
# retrieval can possibly find, and it has to be arguable without editing Python.
# The old Exa fetchers hardcoded strings like "{company} news OR launch OR funding",
# so changing a pain above changed scoring and left retrieval searching for the
# same thing it always had.
#
# Drawn from the observable_via lines of the pains above. Keep it short — these
# are appended to a company-scoped query, and a long tail of weak terms dilutes it.
retrieval:
  search_terms:
    - reconciliation
    - month-end close
    - ERP migration
    - payment operations
    - billing

ranker:
  card_cap: 10

# Guardrails applied after drafting.
#
# stale_days: past this age, calling a signal "recent" is a false claim rather
# than a vague one. Set from a real defect: a 1,826-day-old podcast was drafted
# as "You recently discussed..." and passed clean, because the verifier only
# checked for a MISSING date, never an old one.
guardrails:
  stale_days: 180
