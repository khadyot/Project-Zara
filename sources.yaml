# ZARA SOURCE REGISTRY
# 
# Defines all sources available to the retrieval fan-out.
# All Apify actors must be pay-per-event/usage and cookieless.

sources:
  # ---------------------------------------------------------
  # RUNG 0 / FREE APIs
  # ---------------------------------------------------------
  - id: "greenhouse"
    type: "free_api"
    pricing_model: "free"
    tier: "company"
    signal_type: "hiring"

  - id: "lever"
    type: "free_api"
    pricing_model: "free"
    tier: "company"
    signal_type: "hiring"

  - id: "ashby"
    type: "free_api"
    pricing_model: "free"
    tier: "company"
    signal_type: "hiring"

  - id: "smartrecruiters"
    type: "free_api"
    pricing_model: "free"
    tier: "company"
    signal_type: "hiring"

  - id: "recruitee"
    type: "free_api"
    pricing_model: "free"
    tier: "company"
    signal_type: "hiring"

  - id: "google_news_rss"
    type: "free_api"
    pricing_model: "free"
    tier: "company"
    signal_type: "news"

  - id: "groq_compound"
    type: "free_api" # Groq 'compound' agentic web search model
    pricing_model: "free"
    tier: "person"
    signal_type: "person_mention"

  - id: "tavily"
    type: "paid_api" # paid gap-filler: fires only on person-signal drought
    pricing_model: "credit_based"
    free_tier_credits_per_month: 1000
    queries_per_prospect_cap: 3

  - id: "parallel_search"
    type: "paid_api" # primary rung-1 search; one request carries the whole query plan
    pricing_model: "per_request"
    cost_per_request_usd: 0.001   # fast/turbo tier; basic/advanced is 0.005
    tier: "person"                # tier is inferred per card, not asserted by the source
    signal_type: "person_mention"

  - id: "brave_llm_context"
    type: "paid_api" # evaluated 2026-09-02, not wired: bills per QUERY, so a
                     # three-angle plan is 0.015 against parallel's 0.001. Held in
                     # reserve for dated news -- 87% of its cards carried a date
                     # against parallel's 60%.
    pricing_model: "per_request"
    cost_per_request_usd: 0.005
    tier: "company"
    signal_type: "news"

  - id: "jina_reader"
    type: "free_api" # keyless clean-markdown extraction of company homepage
    pricing_model: "free"
    tier: "company"
    signal_type: "firmographic"

  - id: "sec_edgar"
    type: "free_api" # Via scoped Exa
    pricing_model: "free"
    tier: "company"
    signal_type: "news"

  - id: "company_blog"
    type: "free_api" # Via scoped Exa
    pricing_model: "free"
    tier: "company"
    signal_type: "news"

  - id: "youtube_transcripts"
    type: "free_api" # Via scoped Exa + youtube-transcript-api
    pricing_model: "free"
    tier: "person"
    signal_type: "social"

  # ---------------------------------------------------------
  # APIFY ACTORS (16 Total)
  # ---------------------------------------------------------

  # -- LINKEDIN (x4) --
  - id: "harvestapi/linkedin-company"
    type: "apify"
    pricing_model: "pay_per_event"
    tier: "company"
    signal_type: "firmographic"
    cookieless_proof: "Schema confirms no li_at/JSESSIONID required. 'No cookies or account required... $4 per 1k companies'."

  - id: "supreme_coder/linkedin-profile-scraper"
    type: "apify"
    pricing_model: "pay_per_event"
    tier: "person"
    signal_type: "profile"
    cookieless_proof: "Schema confirms no cookies needed. Undercuts harvestapi at $3 per 1000 profiles."

  - id: "harvestapi/linkedin-profile-posts"
    type: "apify"
    pricing_model: "pay_per_event"
    tier: "person"
    signal_type: "social"
    cookieless_proof: "Schema confirms no cookies needed. Marketed as 'No Cookies'."

  - id: "curious_coder/linkedin-jobs-scraper"
    type: "apify"
    pricing_model: "pay_per_event"
    tier: "company"
    signal_type: "hiring"
    cookieless_proof: "Schema confirms cookies are OPTIONAL. KNOWN LIMITATION: Caps at ~400 jobs without cookies. This cap is acceptable; never add cookies to lift it."

